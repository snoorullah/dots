# aerc over the local notmuch index of the work mailbox (~/Mail/work).
#
# There is NO outgoing / SMTP section anywhere: this machine cannot send mail. Replying
# ends in :postpone, which files the draft in Drafts; the sync pushes it up and it is sent
# from the mail client of record. accounts.conf is written by `dots-mail render`.
# Triage tags (done, waiting, vip, ...) are applied by `dots-inbox` and the one-key binds
# in binds.conf; the virtual folders are in notmuch-queries.

[general]
default-menu-cmd = fzf
# mail is the user's only secret here, and accounts.conf holds no password
unsafe-accounts-conf = false

[ui]
index-columns = flags:4,name<20%,subject,date>=
column-flags = {{.Flags | join ""}}
column-name = {{index (.From | names) 0}}
column-subject = {{.ThreadPrefix}}{{.Subject}}
column-date = {{.DateAutoFormat .Date.Local}}
threading-enabled = false
sidebar-width = 18
mouse-enabled = true
timestamp-format = 2006-01-02 15:04
this-day-time-format = 15:04
this-week-time-format = Mon 15:04
this-year-time-format = Jan 02
empty-message = (nothing here)
fuzzy-complete = true

[statusline]
status-columns = left<*,right>=
column-left = [{{.Account}}] {{.StatusInfo}}
column-right = {{.TrayInfo}} | {{cwd}}

[viewer]
pager = less -R
alternatives = text/plain,text/html
# HTML mail is rendered as text; nothing is fetched from the network

[compose]
editor = nvim
# a reply is a draft the user finishes elsewhere; never an outgoing message
reply-to-self = false
empty-subject-warning = true

[filters]
text/plain = colorize
text/html = w3m -dump -T text/html -I UTF-8 -O UTF-8
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
.headers = colorize
