# aerc keys. Triage is one key, and every one of them LEAVES the message in the archive,
# it never deletes anything:
#
#   d   done      -inbox +done      handled, out of the way
#   w   waiting   +waiting -inbox   I am waiting on someone; the ledger watches the thread
#   v   vip       +vip              this sender always interrupts (tag only; add them to
#                                   `vip` in rules.toml to make it permanent)
#   a   archive   -inbox            not done, not needed now
#   !   critical  +critical +inbox  ask an agent for a read-only analysis, keep it visible
#   u   unread    toggle the unread flag
#
# Replying: rr opens a compose window; there is no send key on purpose. Finish with
# :postpone (Ctrl+s) -> Drafts -> sent from Outlook.

[messages]
q = :quit<Enter>
j = :next<Enter>
k = :prev<Enter>
<Down> = :next<Enter>
<Up> = :prev<Enter>
<C-d> = :next 50%<Enter>
<C-u> = :prev 50%<Enter>
g = :select 0<Enter>
G = :select -1<Enter>
J = :next-folder<Enter>
K = :prev-folder<Enter>
<Enter> = :view<Enter>
/ = :search<space>
n = :next-result<Enter>
N = :prev-result<Enter>
<Esc> = :clear<Enter>
? = :help keys<Enter>
: = :cmd<space>

d = :modify-labels -inbox +done<Enter>
w = :modify-labels +waiting -inbox<Enter>
v = :modify-labels +vip<Enter>
a = :modify-labels -inbox<Enter>
! = :modify-labels +critical +inbox<Enter>
u = :read -t<Enter>

rr = :reply -aq<Enter>
rq = :reply -q<Enter>

[view]
q = :close<Enter>
j = :next<Enter>
k = :prev<Enter>
<C-n> = :next-part<Enter>
<C-p> = :prev-part<Enter>
o = :open<Enter>
d = :modify-labels -inbox +done<Enter>:close<Enter>
w = :modify-labels +waiting -inbox<Enter>:close<Enter>
v = :modify-labels +vip<Enter>
a = :modify-labels -inbox<Enter>:close<Enter>
! = :modify-labels +critical +inbox<Enter>
u = :read -t<Enter>
rr = :reply -aq<Enter>
rq = :reply -q<Enter>

[compose]
$noinherit = true
$ex = <C-x>
<C-s> = :postpone<Enter>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-q> = :abort<Enter>

[compose::editor]
$noinherit = true
$ex = <C-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>

[compose::review]
# deliberately no send binding: y saves the draft
y = :postpone<Enter>
q = :abort<Enter>
e = :edit<Enter>
a = :attach<space>
d = :detach<space>
