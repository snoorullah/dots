# Route only RemoteDesktop to hypr-kdeconnect-fix (nix package hypr-kdeconnect-fix); the rest stays with the
# Hyprland portal. Taken from the "Portal Configuration" Hyprland example in
# https://github.com/gfhdhytghd/hypr-kdeconnect-fix README.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.RemoteDesktop=hypr-kdeconnect
