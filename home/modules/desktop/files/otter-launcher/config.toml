# otter-launcher - banner-top otter (Dracula). Generated by build_otter.py.
[general]
default_module = "ws"
vi_mode = false
loop_mode = false
esc_to_abort = true
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
delay_startup = 30

[interface]
suggestion_mode = "list"
suggestion_lines = 12
customized_list_order = true
header_cmd = "$HOME/.config/otter-launcher/scripts/otter-header.sh"
header_cmd_trimmed_lines = 0
header = "\n  \u001b[38;2;189;147;249m❯\u001b[0m "
separator = ""
footer = "\n  \u001b[38;2;98;114;164m──────────────────────────────────────────────────────────\u001b[0m\n  \u001b[38;2;189;147;249m↑↓\u001b[38;2;98;114;164m move   \u001b[38;2;189;147;249m⏎\u001b[38;2;98;114;164m run   \u001b[38;2;189;147;249m⇥\u001b[38;2;98;114;164m complete   \u001b[38;2;189;147;249m?\u001b[38;2;98;114;164m cheatsheet\u001b[0m"
place_holder = "type a prefix…"
prefix_padding = 3
list_prefix = "     "
selection_prefix = "   \u001b[38;2;255;121;198m▌\u001b[0m "
prefix_color = "\u001b[38;2;189;147;249m"
description_color = "\u001b[38;2;248;248;242m"
place_holder_color = "\u001b[38;2;98;114;164m"
cursor_shape = 6

[[modules]]
description = "  project context"
prefix = "c"
cmd = "/home/devsupreme/.local/bin/ctx '{}'"
with_argument = true
unbind_proc = true

[[modules]]
description = "  web search"
prefix = "ws"
cmd = "xdg-open 'https://duckduckgo.com/?q={}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "  shell"
prefix = "sh"
cmd = "kitty --hold -e sh -c '{}'"
with_argument = true
unbind_proc = true

[[modules]]
description = "  wallpaper picker"
prefix = "wp"
cmd = "kitty --class wallpaper --config /home/devsupreme/.config/kitty/otter.conf -e /home/devsupreme/.local/bin/wallpaper"
unbind_proc = true

[[modules]]
description = "  bluetooth"
prefix = "bt"
cmd = "kitty --class bluetuith --config /home/devsupreme/.config/kitty/bluetuith.conf -e bluetuith"
unbind_proc = true

[[modules]]
description = "  apps"
prefix = "app"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-app.sh"

[[modules]]
description = "  windows"
prefix = "win"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-win.sh"

[[modules]]
description = "  run"
prefix = "run"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-run.sh"

[[modules]]
description = "  power"
prefix = "pw"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-power.sh"

[[modules]]
description = "  media"
prefix = "md"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-media.sh"

[[modules]]
description = "  youtube music"
prefix = "ym"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-ytm.sh"

[[modules]]
description = "  projects"
prefix = "pj"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-projects.sh"

[[modules]]
description = "  tmux"
prefix = "tm"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-tmux.sh"

[[modules]]
description = "  obsidian"
prefix = "ob"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-obsidian.sh"

[[modules]]
description = "  zen tabs"
prefix = "zt"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-tabs.sh"

[[modules]]
description = "  git identity"
prefix = "git"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-git.sh"

[[modules]]
description = "  bookmarks"
prefix = "bm"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-bookmarks.sh"

[[modules]]
description = "  systemd"
prefix = "sys"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-systemd.sh"

[[modules]]
description = "  files"
prefix = "fb"
cmd = "/home/devsupreme/.config/otter-launcher/scripts/otter-files.sh"

[[modules]]
description = "  clipboard"
prefix = "cl"
cmd = "kitty --class clipse --config /home/devsupreme/.config/kitty/otter.conf -e /home/devsupreme/.local/bin/clipse"
unbind_proc = true

[[modules]]
description = "  tasks"
prefix = "tw"
cmd = "kitty --class tasktui --config /home/devsupreme/.config/kitty/tasktui.conf -e /home/devsupreme/.local/bin/tw-tui"
unbind_proc = true

[[modules]]
description = "observe: datasette over timetrack.db"
prefix = "tt"
cmd = "kitty --class datasette --config /home/devsupreme/.config/kitty/otter.conf -e /home/devsupreme/.local/bin/timetrack-datasette"
unbind_proc = true
