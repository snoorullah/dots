# tasktui.conf — kitty config for the taskwarrior-tui daily driver.
#
# taskwarrior-tui is a FULL-SCREEN TUI, so (unlike otter.conf's floating fzf menus)
# it must sit on a clean SOLID Dracula background — no launcher wallpaper bleeding
# through. Inherits the Dracula palette + font from kitty.conf, then forces a solid
# Dracula background with only a hint of translucency to match the desktop.
include ~/.config/kitty/kitty.conf

background_image        none
background              #282a36
background_opacity      0.94
background_tint         1.0
background_tint_gaps    1.0

# a little breathing room around the panel
window_padding_width    8
