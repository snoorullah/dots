# kitty surface for the bluetuith bluetooth panel.
# = the otter panel surface + a faded / grained / Dracula-tinted
#   Christian Bale (headphones) background behind the TUI.
include ~/.config/kitty/otter.conf

background_image        ~/.config/kitty/images/bluetuith-bg.png
background_image_layout cscaled
background_tint         0.70
background_tint_gaps    1.0
background_opacity      1.0
